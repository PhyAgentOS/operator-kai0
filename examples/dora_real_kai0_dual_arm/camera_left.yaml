# USB 相机配置：左腕相机（usb_camera 节点）
# device 为示例值（真机部署按现场修改），
# 可用 `v4l2-ctl --list-devices` 确认设备路径。output_id 须与 dataflow 的 outputs 对齐。
# 注意：左腕画面映射 kai0 服务端 hand_left 相机（image_inputs 契约）。
device: "/dev/v4l/by-path/pci-0000:80:14.0-usb-0:6:1.4-video-index0"
output_id: image
image_format: jpeg
image_jpeg_quality: 85
width: 640
height: 480
fps: 30
