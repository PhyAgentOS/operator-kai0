# robot_router 配置（复制自 forge_studio dual_arm_sim_pi05 模板）
joints:
# 左右 gripper 均表示两指总开口，范围为 0..0.105 m。
- name: robot_left/joint1
  mode: position
  unit: radians
- name: robot_left/joint2
  mode: position
  unit: radians
- name: robot_left/joint3
  mode: position
  unit: radians
- name: robot_left/joint4
  mode: position
  unit: radians
- name: robot_left/joint5
  mode: position
  unit: radians
- name: robot_left/joint6
  mode: position
  unit: radians
- name: robot_left/gripper
  mode: prismatic
  unit: meters
- name: robot_right/joint1
  mode: position
  unit: radians
- name: robot_right/joint2
  mode: position
  unit: radians
- name: robot_right/joint3
  mode: position
  unit: radians
- name: robot_right/joint4
  mode: position
  unit: radians
- name: robot_right/joint5
  mode: position
  unit: radians
- name: robot_right/joint6
  mode: position
  unit: radians
- name: robot_right/gripper
  mode: prismatic
  unit: meters
robots:
- id: piper_left
  joints: [robot_left/joint1, robot_left/joint2, robot_left/joint3, robot_left/joint4, robot_left/joint5, robot_left/joint6,
    robot_left/gripper]
  actuator_order: [joint1, joint2, joint3, joint4, joint5, joint6, gripper]
  joint_to_actuator:
    robot_left/joint1: joint1
    robot_left/joint2: joint2
    robot_left/joint3: joint3
    robot_left/joint4: joint4
    robot_left/joint5: joint5
    robot_left/joint6: joint6
    robot_left/gripper: gripper
- id: piper_right
  joints: [robot_right/joint1, robot_right/joint2, robot_right/joint3, robot_right/joint4, robot_right/joint5, robot_right/joint6,
    robot_right/gripper]
  actuator_order: [joint1, joint2, joint3, joint4, joint5, joint6, gripper]
  joint_to_actuator:
    robot_right/joint1: joint1
    robot_right/joint2: joint2
    robot_right/joint3: joint3
    robot_right/joint4: joint4
    robot_right/joint5: joint5
    robot_right/joint6: joint6
    robot_right/gripper: gripper
image_forward:
  image/top: image/top
  image/left: image/left
  image/right: image/right
