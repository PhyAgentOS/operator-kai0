[project]
name = "kai0-inference"
version = "1.0.4"
description = "kai0 (openpi/JAX) policy node for Forge: WS client adapter with Dora inference runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # numpy 1.26 与传输层（websockets/msgpack 字典线格式 codec）及 fake server（numpy<2）兼容
    "numpy==1.26.4",
    "PyYAML>=6.0",

    # WS 传输层（同步模式短连接）
    "websockets>=13.0",
    "msgpack>=1.0.5",

    # forge 家族全 PyPI 发行版（无 git 来源）：forge-msgs 1.2.0 起含 ToolMessage，
    # forge-tool[dora]==1.0.0 含完整 session SPI 与 dora 载波
    "forge-msgs==1.2.0",
    "forge-common==1.0.1",
    "forge-policy==1.0.1",
    "forge-tool[dora]==1.0.0",
    "dora-rs==0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # session endpoint 单测（async SPI）需要；asyncio_mode=auto 见 [tool.pytest.ini_options]
    "pytest-asyncio>=0.24",
]

[project.scripts]
# 统一入口：kai0 <infer|infer-once> ...
kai0 = "kai0_inference.cli:main"
# 兼容旧命令名（自动注入对应子命令）
kai0-infer-once = "kai0_inference.cli:main_infer_once"
kai0-infer = "kai0_inference.cli:main_infer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-packages = false

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "kai0_inference/__init__.py"
"__main__.py" = "kai0_inference/__main__.py"
"cli.py" = "kai0_inference/cli.py"
"inference" = "kai0_inference/inference"
"common" = "kai0_inference/common"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
